<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partial 1 Index - Quality Topics for Software Design</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #faf0e6 0%, #e8dccb 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      background: #fffbf0;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px -5px rgba(121, 85, 72, 0.1), 0 10px 15px -10px rgba(121, 85, 72, 0.05);
      width: 100%;
      max-width: 480px;
      text-align: center;
      border: 1px solid rgba(215, 201, 191, 0.3);
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #3e2723;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 0.95rem;
      font-weight: 700;
      color: #8d1d0c;
      margin-bottom: 4px;
    }

    .header-utd {
      font-size: 1.1rem;
      font-weight: 800;
      color: #bf360c;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #4e342e;
      border-bottom: 2px solid #d7ccc8;
      padding-bottom: 6px;
      margin: 20px 0 12px 0;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .contenedor-botones {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn-diagrama {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      background-color: #bf360c;
      color: #fff8e1;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(191, 54, 12, 0.12);
      transition: all 0.25s ease;
    }

    .btn-diagrama:hover {
      background-color: #e65100;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(230, 81, 0, 0.25);
    }

    .student-info {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px dashed #bcaaa4;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #bf360c;
      margin-bottom: 14px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.12);
    }

    .student-detail {
      font-size: 0.95rem;
      color: #3e2723;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <main class="card">
    <h1 class="header-title">PARTIAL 1 INDEX</h1>
    <h2 class="header-subtitle">QUALITY TOPICS FOR SOFTWARE DESIGN</h2>
    <h3 class="header-utd">UTD</h3>

    <!-- Diagramas de Flujo y Procesos del Asistente y Clientes -->
    <div class="section-title">Flowchart Section</div>
    <div class="contenedor-botones">
      <a href="assistan.html" class="btn-diagrama">Diagrama General Asistente</a>
      <a href="assistan_economi.drawio.html" class="btn-diagrama">Diagrama Flujo Económico</a>
      <a href="costumers.html" class="btn-diagrama">Diagrama Clientes</a>
    </div>

    <!-- Diagramas de Casos de Uso y Actores -->
    <div class="section-title">Use Case Section</div>
    <div class="contenedor-botones">
      <a href="actor.html" class="btn-diagrama">Diagrama de Actores</a>
    </div>

    <!-- Información de la Estudiante -->
    <div class="student-info">
      <img src="perfil.jpg" alt="Foto de Alejandra" width="400" height="400" class="profile-img">
      <p class="student-detail"><strong>STUDENT:</strong> ALEJANDRA ROJERO VALLES</p>
      <p class="student-detail"><strong>EMAIL:</strong> alejandrarojerovalles@gmail.com</p>
    </div>
  </main>

</body>
</html>
